[package]
name = "proof-server"
version = "0.1.0"
edition = "2021"

[[example]]
name = "benchmark_proof_async"
path = "examples/benchmark_proof_async.rs"

[dependencies]
# Web framework
axum = "0.7"
num_cpus = "1.16"
rayon = "1.11"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto & zkSNARK
commitmentgen = { path = "../commitmentgen" }
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
ark-crypto-primitives = { version = "0.4.0", features = ["r1cs", "sponge", "crh"] }
hex = "0.4"

# Sui SDK (optional - for auto-publish)
# Note: Sui crates are not published to crates.io and must use git source.
# The Sui repository is very large (~1GB+). Build with --features sui-auto-publish to enable.
sui-sdk = { git = "https://github.com/MystenLabs/sui.git", rev = "mainnet-v1.37.3", optional = true }
sui-types = { git = "https://github.com/MystenLabs/sui.git", rev = "mainnet-v1.37.3", optional = true }
sui-keys = { git = "https://github.com/MystenLabs/sui.git", rev = "mainnet-v1.37.3", optional = true }
shared-crypto = { git = "https://github.com/MystenLabs/sui.git", rev = "mainnet-v1.37.3", optional = true }

# Error handling
anyhow = "1.0"

# Environment and config
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"

# System utilities
dirs = "5.0"

[features]
default = []
sui-auto-publish = ["sui-sdk", "sui-types", "sui-keys", "shared-crypto"]

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"

# CRITICAL FIX: Force all dependencies to be optimized in release mode
# This is especially important for path dependencies and arkworks crates
[profile.release.package."*"]
opt-level = 3

# Specifically ensure arkworks crates are optimized
[profile.release.package.ark-ff]
opt-level = 3

[profile.release.package.ark-ec]
opt-level = 3

[profile.release.package.ark-std]
opt-level = 3

[profile.release.package.ark-serialize]
opt-level = 3

[profile.release.package.ark-groth16]
opt-level = 3

[profile.release.package.ark-bn254]
opt-level = 3

[profile.release.package.ark-crypto-primitives]
opt-level = 3

[profile.release.package.ark-r1cs-std]
opt-level = 3

[profile.release.package.ark-relations]
opt-level = 3

# Optimize the local commitmentgen dependency
[profile.release.package.commitmentgen]
opt-level = 3